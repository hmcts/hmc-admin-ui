apiVersion: v2
appVersion: '1.0'
description: A Helm chart for hmc-admin-ui App
name: hmc-admin-ui
home: https://github.com/hmcts/hmc-admin-ui
version: 0.0.14
dependencies:
  - name: nodejs
    version: 3.2.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
  - name: idam-pr
    version: ~2.3.0
    repository: 'oci://hmctsprod.azurecr.io/helm'
    condition: idam-pr.enabled
  - name: redis
    version: 24.1.3
    repository: 'oci://registry-1.docker.io/bitnamicharts'
    condition: redis.enabled
