nodejs:
  devmemoryRequests: 256Mi
  devmemoryLimits: 1Gi
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  ingressAnnotations:
    external-dns.alpha.kubernetes.io/exclude: 'true'
  keyVaults:
    hmc:
      secrets:
        - AppInsightsInstrumentationKey
        - hmc-admin-ui-session-secret
        - hmc-admin-ui-client-secret
        - hmc-admin-ui-s2s-secret
  environment:
    NODE_OPTIONS: '--max-old-space-size=512'
    HMC_ADMIN_UI_BASE_URL: https://${SERVICE_FQDN}
    REDIS_ENABLED: false
idam-pr:
  enabled: true
  redirect_uris:
    hmc-admin-ui:
      - https://${SERVICE_FQDN}/oauth2/callback
