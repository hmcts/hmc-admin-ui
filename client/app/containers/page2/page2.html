<div class="govuk-grid-row" xmlns="http://www.w3.org/1999/html">
  <div class="govuk-grid-column-two-thirds">
    <div class="govuk-form-group">
      <h1 class="govuk-label-wrapper">
        <label class="govuk-label govuk-label--l">{{ 'Please select one of the following options page two' }}</label>
      </h1>
      <form class="form" [formGroup]="hearingPanelRequiredForm">
        <div class="govuk-radios govuk-radios--inline" data-module="govuk-radios" id="hearingPanelRequired">
          <div class="govuk-radios__item">
            <input
              class="govuk-radios__input"
              id="hearing_panel_choice_yes"
              name="hearingPanelRequired"
              formControlName="hearingPanelRequired"
              type="radio"
              [value]="true"
            />
            <label class="govuk-label govuk-radios__label" for="hearing_panel_choice_yes">
              {{ 'Singular Request page two' }}
            </label>
          </div>
          <br />
          <div class="govuk-radios__item">
            <input
              class="govuk-radios__input"
              id="hearing_panel_choice_no"
              name="hearingPanelRequired"
              formControlName="hearingPanelRequired"
              type="radio"
              [value]="false"
            />
            <label class="govuk-label govuk-radios__label" for="hearing_panel_choice_no">
              {{ 'Bulk Request page two' }}
            </label>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
