<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <!-- Page title that your smoke test expects -->
    <h1 class="govuk-heading-xl">Admin UI - Support Tools</h1>

    <form class="form" [formGroup]="supportOptionsForm" (ngSubmit)="onSubmit()">
      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset" aria-describedby="support-options-hint">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
            <h2 class="govuk-fieldset__heading">Please select one of the following options</h2>
          </legend>

          <div id="support-options-hint" class="govuk-hint">Choose the type of request you want to make.</div>

          <div class="govuk-radios govuk-radios--inline" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input
                class="govuk-radios__input"
                id="support_option_choice_yes"
                name="supportOption"
                formControlName="supportOption"
                type="radio"
                [value]="true"
              />
              <label class="govuk-label govuk-radios__label" for="support_option_choice_yes"> Singular Request </label>
            </div>

            <div class="govuk-radios__item">
              <input
                class="govuk-radios__input"
                id="support_option_choice_no"
                name="supportOption"
                formControlName="supportOption"
                type="radio"
                [value]="false"
              />
              <label class="govuk-label govuk-radios__label" for="support_option_choice_no"> Bulk Request </label>
            </div>
          </div>
        </fieldset>
      </div>

      <button class="govuk-button" data-module="govuk-button" type="submit">Continue</button>
    </form>
  </div>
</div>
